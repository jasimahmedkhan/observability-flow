name: observability-flow

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: observability
      MINIO_ROOT_PASSWORD: observability-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - observability

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set observability http://minio:9000 observability observability-secret
        mc mb --ignore-existing observability/tempo-traces
        mc mb --ignore-existing observability/loki-data
        mc mb --ignore-existing observability/mimir-blocks
        mc mb --ignore-existing observability/mimir-ruler
        mc mb --ignore-existing observability/mimir-alertmanager
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - observability

  mimir:
    image: grafana/mimir:latest
    command:
      - -config.file=/etc/mimir/mimir.yaml
    depends_on:
      minio-init:
        condition: service_completed_successfully
    expose:
      - "9009"
    volumes:
      - ./mimir:/etc/mimir:ro
      - mimir-data:/tmp/mimir
    networks:
      - observability

  loki:
    image: grafana/loki:latest
    user: "0:0"
    command:
      - -config.file=/etc/loki/config.yml
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3100:3100"
    volumes:
      - ./loki:/etc/loki:ro
      - loki-data:/var/loki
    networks:
      - observability

  tempo:
    image: grafana/tempo:latest
    user: "0:0"
    command:
      - -config.file=/etc/tempo/config.yml
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "3200:3200"
    expose:
      - "4317"
      - "4318"
    volumes:
      - ./tempo:/etc/tempo:ro
      - tempo-data:/var/tempo
    networks:
      - observability

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
    networks:
      - observability

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command:
      - --config=/etc/otelcol-contrib/otel-collector-config.yaml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "9464:9464"
    environment:
      DEPLOYMENT_ENVIRONMENT: development
    volumes:
      - ./otel:/etc/otelcol-contrib:ro
    networks:
      - observability

  checkout-service:
    build:
      context: ./observability-flow
      dockerfile: Dockerfile
    image: checkout-service:local
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      OTEL_SERVICE_NAME: checkout-service
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_METRIC_EXPORT_INTERVAL: "5000"
    depends_on:
      - otel-collector
    networks:
      - observability

networks:
  observability:
    driver: bridge

volumes:
  minio-data:
  prometheus-data:
  mimir-data:
  loki-data:
  tempo-data:
