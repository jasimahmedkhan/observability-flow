name: observability-flow

services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z.hotfix.7aa24e772
    command:
      - server
      - /data
      - --console-address
      - :9001
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: observability
      MINIO_ROOT_PASSWORD: observability-secret
    volumes:
      - minio-data:/data
    healthcheck:
      test:
        - CMD
        - mc
        - ready
        - local
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - observability

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set observability http://minio:9000 observability observability-secret
        mc mb --ignore-existing observability/tempo-traces
        mc mb --ignore-existing observability/loki-data
        mc mb --ignore-existing observability/mimir-blocks
        mc mb --ignore-existing observability/mimir-ruler
        mc mb --ignore-existing observability/mimir-alertmanager
    networks:
      - observability

  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --enable-feature=exemplar-storage
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks:
      - observability

  mimir:
    image: grafana/mimir:latest
    command:
      - -config.file=/etc/mimir/mimir.yaml
    depends_on:
      minio-init:
        condition: service_completed_successfully
    expose:
      - "9009"
    volumes:
      - ./mimir:/etc/mimir:ro
      - mimir-data:/tmp/mimir
    networks:
      - observability



networks:
  observability:
    driver: bridge

volumes:
  minio-data:
  prometheus-data:
  mimir-data:
  loki-data:
  tempo-data:
